# Butler Prompt Injection Security Module Configuration
version: "2.0.0-advanced"
module: "prompt_injection"

paths:
  raw_dir: "prompt_injection/datasets/raw"
  processed_dir: "prompt_injection/datasets/processed"
  models_dir: "prompt_injection/models"
  reports_dir: "prompt_injection/reports"
  figures_dir: "prompt_injection/reports/figures"

preprocessing:
  normalize_unicode: true
  unicode_form: "NFKC"
  unescape_html: true
  min_text_length: 3
  jaccard_similarity_threshold: 0.92

feature_engineering:
  word_ngram_range: [1, 3]
  word_max_features: 4000
  char_ngram_range: [3, 5]
  char_max_features: 4000
  scaler: "robust"
  domain_indicator_count: 24

training:
  random_state: 42
  test_size: 0.15
  val_size: 0.15
  optuna_trials: 25
  champion_algorithm: "HistGradientBoostingClassifier"
  parameters:
    max_iter: 150
    learning_rate: 0.1
    max_leaf_nodes: 31
    min_samples_leaf: 10
    l2_regularization: 0.5

decision_policy:
  safe_threshold: 25
  needs_review_threshold: 50
  suspicious_threshold: 75
  malicious_threshold: 100
  actions:
    safe: "ALLOW"
    needs_review: "WARN"
    suspicious: "REQUIRE_APPROVAL"
    malicious: "BLOCK"
